<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<!-- Source for site/og.png, the 1200x630 share card. Not linked from the site; it exists
     to be rendered: scripts/make-og.sh. Light brand tokens, system fonts, an invented
     schedule (the same as the home page's illustration). -->
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'">
<title>Method Schedule share card</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/og-card.css">
</head>
<body>
  <div class="card">
    <img class="wm" src="assets/brand/wordmark.svg" alt="Method Schedule">
    <p class="tag">Free and open source</p>
    <div class="copy">
      <h1>Film and TV scheduling, from script to stripboard.</h1>
      <p>Open files on your own computer. Every day count explained.</p>
    </div>
    <div class="sheet">
      <p class="head"><span>Board</span><span>Day 2, Tue Mar 2</span></p>
      <div class="in"><span>31 INT LIGHTHOUSE STAIRS</span><b>1 1/8</b></div>
      <div class="en"><span>32 EXT LIGHTHOUSE GALLERY</span><b>2 3/8</b></div>
      <div class="in"><span>33 INT LAMP ROOM</span><b>7/8</b></div>
      <div class="brk"><span>End of day 2: 3 scenes</span><b>4 3/8</b></div>
    </div>
    <p class="url">methodschedule.com</p>
  </div>
</body></html>
