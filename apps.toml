# The Method Production Suite catalog. One entry per app drives the hub's app cards, the
# suite bar on every page, the shared footer, the sitemap and the domain routing
# (tools/build.py writes functions/_hosts.json from it). Copy rules: plain, specific,
# no hype, no em dashes, never name another vendor's product.

[suite]
name = "Method Production Suite"
domain = "methodproduction.com"
org = "https://github.com/method-production-suite"
discussions = "https://github.com/method-production-suite/.github/discussions"
hello = "hello@methodproduction.com"
# Shows hello@ on the site. True since 2026-10-16, when Sam's test mail to it arrived; set
# false to hide it (the site then points at GitHub's release notifications instead).
hello_live = true
mission = "The tools of the trade shouldn't be rented."
mission_more = "Method makes film's working software free, open and owned by the people who use it, wherever they are and whatever they can spend."
pitch = "Open-source tools for making films, from the first draft to the last shoot day."
lede = "Write the script, read it anywhere, schedule it and budget it, in free apps that run on your own computer and keep your work in open files you own. No subscription, no account, for good."
# Domains that only redirect, with where they go.
redirects = [
  { from = "methodproductionsuite.com", to = "https://methodproduction.com" },
  { from = "methodscreenplay.com", to = "https://methodstoryteller.com" },
  { from = "screepub.com", to = "https://methodreader.com" },
]

# Order is the order of a production: write, read, schedule, budget.

[[app]]
slug = "storyteller"
name = "Method Storyteller"
domain = "methodstoryteller.com"
repo = "https://github.com/method-production-suite/method-storyteller"
does = "Write"
tagline = "Screenwriting that formats itself."
blurb = "Tab and Enter move between scene heading, action, character and dialogue; pages break the way a production expects; Open Screenplay Format is the native file, and Fountain and .fdx open and save."
status = "Early alpha"
platforms = "Mac (Intel and Apple silicon): signed. Windows and Linux: built, not yet tested by a person."
download = "Method-Storyteller-macOS.dmg"
source = "method-storyteller"
# Follows its latest published release tag (Sam, 2026-10-18). Move source_ref to each new
# tag once published.
source_ref = "tag:v0.6.0"
accent = ["#AE3D56", "#EE8DA2"]

[[app]]
slug = "reader"
name = "Method Reader"
domain = "methodreader.com"
repo = "https://github.com/method-production-suite/method-reader"
does = "Read"
tagline = "Screenplay PDFs into e-books and editable scripts."
blurb = "Turn a script PDF into an e-book that reflows on a Kindle or any e-reader with the script's shape intact, and send it straight to the device. Or get the script back to edit, as Fountain or .fdx. Formerly Screepub."
status = "Beta, looking for testers"
platforms = "Mac (Apple silicon): signed. Windows and Linux: built, not yet tested by a person."
download = "Method-Reader-macOS.dmg"
# A released app's site follows its latest published release tag (Sam, 2026-10-18), so it
# describes exactly what the download does. Move source_ref to each new tag once published.
source = "screepub"
source_ref = "tag:v1.1.0"
accent = ["#7052BA", "#B49CF0"]

[[app]]
slug = "schedule"
name = "Method Schedule"
domain = "methodschedule.com"
repo = "https://github.com/method-production-suite/method-scheduling"
does = "Schedule"
tagline = "Film and TV scheduling, from script to stripboard."
blurb = "Breakdown, stripboard, calendar, day out of days and reports, in open files on your own computer. Hands its shoot days straight to Method Budget."
status = "Early alpha"
platforms = "Mac (Intel and Apple silicon): signed. Windows and Linux: built, not yet tested by a person."
download = "Method-Schedule-macOS.dmg"
source = "method-scheduling"
# Follows its latest published release tag (Sam, 2026-10-18). Move source_ref to each new
# tag once published.
source_ref = "tag:v0.7.0"
# The browser demo (methodschedule.com/try/) is built at sync time, like Budget's.
build = ["cargo", "xtask", "web", "--demo", "--out", "site/try"]
build_output = "site/try"
accent = ["#2F5FB3", "#7AA2F0"]

[[app]]
slug = "budget"
name = "Method Budget"
domain = "methodbudget.com"
repo = "https://github.com/method-production-suite/method-budget"
does = "Budget"
tagline = "Film and TV budgeting that shows its working."
blurb = "Topsheet to detail, fringes, globals, versions and compare, and an explanation for every number. Opens the budgets other tools export."
status = "Alpha, ready for testing"
platforms = "Mac (Intel and Apple silicon): signed. Windows and Linux: built, not yet tested by a person."
download = "Method-Budget-macOS.dmg"
source = "method-budget"
# Follows its latest published release tag (Sam, 2026-10-18). Move source_ref to each new
# tag once published.
source_ref = "tag:v0.8.0"
# The browser demo (methodbudget.com/try/) is built, not committed: tools/sync.py runs
# this in an export of the synced commit and copies `build_output` in as try/, the
# way method-budget's old pages.yml did at deploy time.
build = ["cargo", "xtask", "web", "--demo", "--out", "site/try"]
build_output = "site/try"
accent = ["#0E7468", "#2CC7B2"]
